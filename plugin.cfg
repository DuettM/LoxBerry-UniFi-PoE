[AUTHOR]
NAME=Düthorn Marco
EMAIL=duett86@web.de

[PLUGIN]
VERSION=0.7.11
NAME=unifipoe
FOLDER=unifipoe
TITLE=UniFi PoE Control
WEBSITE=https://www.loxberry.de

[AUTOUPDATE]
# Native automatic installation is intentionally disabled because LoxBerry's
# standard plugin updater does not enforce our SHA-256 verification. The plugin
# uses bin/secure_update.py for verified downloads instead.
AUTOMATIC_UPDATES=false
RELEASECFG=https://raw.githubusercontent.com/DuettM/LoxBerry-UniFi-PoE/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/DuettM/LoxBerry-UniFi-PoE/main/prerelease.cfg

[SYSTEM]
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
CUSTOM_LOGLEVELS=false
INTERFACE=2.0

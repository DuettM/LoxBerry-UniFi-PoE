name: Apply UniFi PoE v0.7.23
on:
  push:
    paths:
      - '.github/workflows/apply-v0723.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 tools/patch_v0723.py
          python3 -m py_compile bin/*.py
          grep -q "VERSION='0.7.23'" bin/unifipoe.py
          grep -q 'VERSION=0.7.23' plugin.cfg
          grep -q 'Selbsttest' bin/unifipoe.py
          grep -q 'Watchdog OK' bin/watchdog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/unifipoe.py bin/watchdog.py plugin.cfg release.cfg prerelease.cfg CHANGELOG.md
          git commit -m 'Improve runtime logging in v0.7.23'
          git push

name: Publish v0.7.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.7.5.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## UniFi PoE Control 0.7.5

          ### Neu
          - MQTT auf das zentrale LoxBerry MQTT Gateway umgestellt.
          - Broker-Adresse, Port und Zugangsdaten werden automatisch aus der LoxBerry-Systemkonfiguration gelesen.
          - Standard-Basistopic ist `unifipoe` und bleibt im Webinterface frei konfigurierbar.
          - Bidirektionaler MQTT-Befehlslistener für PoE-Ports und Gruppen.
          - MQTT-Reconnect bei Änderungen der Plugin- oder LoxBerry-MQTT-Konfiguration.
          - Installations- und Upgrade-Migration auf `config_version` 5.
          - Watchdog und Selbsttest an die zentrale MQTT-Konfiguration angepasst.

          ### Installation
          Die Datei `LoxBerry-UniFi-PoE-0.7.5.zip` kann direkt über die LoxBerry-Pluginverwaltung installiert werden.

          ### Hinweis
          Bestehende Benutzerkonfigurationen und benutzerdefinierte MQTT-Topic-Präfixe bleiben beim Update erhalten.
          EOF
          gh release edit v0.7.5 --title "UniFi PoE Control v0.7.5" --notes-file release-notes.md

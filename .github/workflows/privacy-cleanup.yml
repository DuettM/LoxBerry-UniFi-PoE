name: One-time privacy cleanup
on:
  push:
    paths:
      - '.privacy-cleanup-trigger'
      - '.github/workflows/privacy-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean, verify and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          binary_ext={'.zip','.png','.jpg','.jpeg','.gif','.webp','.ico','.sig','.pdf'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.name=='plugin.cfg' or '.git' in p.parts or p.suffix.lower() in binary_ext or p.name=='privacy-cleanup.yml': continue
              try:s=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):continue
              n=s.replace('Düthorn Marco','Project contributors').replace('Marco Düthorn','Project contributors').replace('duett86@web.de','GitHub private vulnerability reporting')
              if n!=s:p.write_text(n,encoding='utf-8')
          PY
          rm -f .privacy-cleanup-trigger .github/workflows/privacy-cleanup.yml
          if grep -RInE 'Düthorn|duett86@web\.de' . --exclude=plugin.cfg --exclude='*.zip' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' --exclude='*.ico' --exclude='*.sig' --exclude='*.pdf' --exclude-dir=.git; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove personal details from project files'
          git push

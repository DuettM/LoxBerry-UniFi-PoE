name: One-time privacy cleanup
on:
  push:
    paths:
      - '.privacy-cleanup-trigger'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove personal details from visible project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          skip_names={'plugin.cfg'}
          skip_parts={'.git'}
          binary_ext={'.zip','.png','.jpg','.jpeg','.gif','.webp','.ico','.sig','.pdf'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.name in skip_names or any(x in p.parts for x in skip_parts) or p.suffix.lower() in binary_ext:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              old=s
              s=s.replace('Düthorn Marco','Project contributors')
              s=s.replace('Marco Düthorn','Project contributors')
              s=s.replace('duett86@web.de','GitHub private vulnerability reporting')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
          PY
          if grep -RInE 'Düthorn|duett86@web\.de' . --exclude=plugin.cfg --exclude-dir=.git; then
            echo 'Personal details still found outside plugin.cfg' >&2
            exit 1
          fi
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm -f .privacy-cleanup-trigger .github/workflows/privacy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove personal details from project files'
          git push

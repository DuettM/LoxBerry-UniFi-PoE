name: Signed Release v0.7.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger-079'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY_B64: ${{ secrets.UNIFIPOE_ED25519_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require signing key
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY_B64:-}" || { echo 'Missing UNIFIPOE_ED25519_PRIVATE_KEY_B64 secret'; exit 1; }
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > /tmp/unifipoe-signing-key.pem
          chmod 600 /tmp/unifipoe-signing-key.pem
      - name: Prepare 0.7.9 sources
        run: |
          set -euo pipefail
          sed -i 's/VERSION=0.7.8/VERSION=0.7.9/g' plugin.cfg
          sed -i "s/VERSION='0.7.8'/VERSION='0.7.9'/g" bin/unifipoe.py
          sed -i 's/Plugin 0.7.8 installiert/Plugin 0.7.9 installiert/g' postinstall.sh
          sed -i 's/Plugin auf 0.7.8 aktualisiert/Plugin auf 0.7.9 aktualisiert/g' postupgrade.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          note='''## 0.7.9\n\n- Ed25519-Publisher-Signaturen für Update-Archive.\n- Secure Updater verlangt SHA-256 **und** gültige Ed25519-Signatur.\n- Öffentlicher Vertrauensschlüssel ist fest im Plugin eingebettet.\n- Manipulierte oder nur neu gehashte Fremdarchive werden verworfen.\n\n'''
          if '## 0.7.9' not in s:
              s=s.replace('# Changelog\n\n','# Changelog\n\n'+note)
          p.write_text(s)
          PY
          python3 -m py_compile bin/unifipoe.py bin/watchdog.py bin/mqtt_listener.py bin/secure_update.py
          bash -n postinstall.sh preupgrade.sh postupgrade.sh cron/cron.01min daemon/daemon uninstall/uninstall.sh
      - name: Build, hash and sign
        run: |
          set -euo pipefail
          rm -rf bin/__pycache__
          mkdir -p releases
          ZIP='releases/LoxBerry-UniFi-PoE-0.7.9.zip'
          SHA="$ZIP.sha256"
          SIG="$ZIP.sig"
          rm -f "$ZIP" "$SHA" "$SIG"
          zip -qr "$ZIP" README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          sha256sum "$ZIP" > "$SHA"
          openssl pkeyutl -sign -rawin -inkey /tmp/unifipoe-signing-key.pem -in "$ZIP" -out /tmp/unifipoe.sig
          base64 -w0 /tmp/unifipoe.sig > "$SIG"
          printf '\n' >> "$SIG"
          python3 - <<'PY'
          import base64, importlib.util
          spec=importlib.util.spec_from_file_location('secure_update','bin/secure_update.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          blob=open('releases/LoxBerry-UniFi-PoE-0.7.9.zip','rb').read()
          sig=base64.b64decode(open('releases/LoxBerry-UniFi-PoE-0.7.9.zip.sig','rb').read())
          pub=bytes.fromhex(m.TRUSTED_PUBLIC_KEY_HEX)
          assert m.verify_ed25519(sig,blob,pub), 'local Ed25519 verification failed'
          PY
      - name: Publish signed metadata and release
        run: |
          set -euo pipefail
          cat > release.cfg <<'EOF'
          [AUTOUPDATE]
          VERSION=0.7.9
          ARCHIVEURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.9/LoxBerry-UniFi-PoE-0.7.9.zip
          INFOURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/blob/main/CHANGELOG.md
          SHA256URL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.9/LoxBerry-UniFi-PoE-0.7.9.zip.sha256
          SIGURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.9/LoxBerry-UniFi-PoE-0.7.9.zip.sig
          EOF
          cp release.cfg prerelease.cfg
          rm -f .release-trigger-079 .github/workflows/release-signed-079.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release signed security update v0.7.9'
          git push
          cat > /tmp/notes.md <<'EOF'
          ## UniFi PoE Control 0.7.9

          ### Signierte Updates
          - Update-ZIP wird mit Ed25519 signiert.
          - Der LoxBerry prüft SHA-256 und Publisher-Signatur.
          - Der öffentliche Vertrauensschlüssel ist fest im Plugin eingebettet.
          - Ein Angreifer kann ein manipuliertes Archiv nicht allein durch Anpassen der SHA-Datei gültig machen.
          EOF
          gh release create v0.7.9 \
            releases/LoxBerry-UniFi-PoE-0.7.9.zip \
            releases/LoxBerry-UniFi-PoE-0.7.9.zip.sha256 \
            releases/LoxBerry-UniFi-PoE-0.7.9.zip.sig \
            --target main --title 'UniFi PoE Control v0.7.9' --notes-file /tmp/notes.md

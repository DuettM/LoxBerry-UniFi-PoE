name: Run release 0.7.8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-release-078.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        run: python3 tools/release_078.py
      - name: Validate
        run: |
          chmod 755 bin/secure_update.py webfrontend/html/poe.cgi
          python3 -m py_compile bin/unifipoe.py bin/watchdog.py bin/mqtt_listener.py bin/secure_update.py
          bash -n postinstall.sh preupgrade.sh postupgrade.sh cron/cron.01min daemon/daemon uninstall/uninstall.sh
          grep -q 'VERSION=0.7.8' plugin.cfg
          grep -q "VERSION='0.7.8'" bin/unifipoe.py
          grep -q 'AUTOMATIC_UPDATES=false' plugin.cfg
          grep -q 'command_token_required' bin/mqtt_listener.py
          grep -q 'HTTP_X_API_TOKEN' webfrontend/html/poe.cgi
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf bin/__pycache__
          mkdir -p releases
          rm -f releases/LoxBerry-UniFi-PoE-0.7.8.zip releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256
          zip -qr releases/LoxBerry-UniFi-PoE-0.7.8.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          sha256sum releases/LoxBerry-UniFi-PoE-0.7.8.zip > releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256
          rm -f tools/release_078.py .github/workflows/run-release-078.yml .github/workflows/release-v0.7.8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release security hardening v0.7.8'
          git push
          printf '%s\n' '## UniFi PoE Control 0.7.8' '' '### Security' '- API-Token nur noch via Header oder POST-Body, nicht mehr in der URL.' '- Separates MQTT-Command-Token, standardmäßig erforderlich.' '- Native ungeprüfte LoxBerry-Auto-Installation deaktiviert.' '- Secure Update Downloader prüft SHA-256 gegen ein separates Release-Checksum-Asset.' '' '### Hinweis' '- Eine echte Publisher-Signatur benötigt einen dauerhaft geheim gehaltenen privaten Signierschlüssel. Ein solcher Schlüssel wird bewusst nicht im Repository gespeichert.' > /tmp/notes.md
          gh release create v0.7.8 releases/LoxBerry-UniFi-PoE-0.7.8.zip releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256 --target main --title 'UniFi PoE Control v0.7.8' --notes-file /tmp/notes.md

name: Release v0.7.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.7.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish 0.7.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed -i 's/VERSION=0.7.6/VERSION=0.7.7/g' plugin.cfg release.cfg prerelease.cfg
          sed -i "s/VERSION='0.7.6'/VERSION='0.7.7'/g" bin/unifipoe.py
          sed -i 's/LoxBerry-UniFi-PoE-0.7.6.zip/LoxBerry-UniFi-PoE-0.7.7.zip/g' release.cfg prerelease.cfg
          python3 -m py_compile bin/unifipoe.py bin/watchdog.py bin/mqtt_listener.py
          bash -n postinstall.sh preupgrade.sh postupgrade.sh cron/cron.01min daemon/daemon uninstall/uninstall.sh
          rm -rf bin/__pycache__
          mkdir -p releases
          rm -f releases/LoxBerry-UniFi-PoE-0.7.7.zip
          zip -qr releases/LoxBerry-UniFi-PoE-0.7.7.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.cfg release.cfg prerelease.cfg bin/unifipoe.py releases/LoxBerry-UniFi-PoE-0.7.7.zip
          git commit -m "Release security hardening v0.7.7"
          git push
          printf '%s\n' '## UniFi PoE Control 0.7.7' '' '### Security-Hardening' '- Cross-Site-Request-Schutz für die authentifizierten CGI-Endpunkte.' '- Cross-Site-PoE-Schaltbefehle der internen Web-API werden blockiert.' '- Zusätzliche Referrer-Policy- und nosniff-Header.' '- Die Loxone-Token-API bleibt kompatibel.' '' '### Noch zu beachten' '- MQTT-Schaltbefehle sind so sicher wie die Broker-ACLs. Nur vertrauenswürdige Clients sollten auf unifipoe/set/# publizieren dürfen.' '- Bei deaktivierter TLS-Zertifikatsprüfung zum UniFi-Controller besteht ein MITM-Risiko.' > /tmp/notes.md
          gh release create v0.7.7 releases/LoxBerry-UniFi-PoE-0.7.7.zip --target main --title "UniFi PoE Control v0.7.7" --notes-file /tmp/notes.md

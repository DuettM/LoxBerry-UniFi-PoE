name: Package UniFi PoE v0.7.22
on:
  push:
    paths:
      - '.github/workflows/package-v0722.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          set -euo pipefail
          grep -q '^VERSION=0.7.22$' plugin.cfg
          grep -q "cmd=health" webfrontend/htmlauth/index.cgi
          grep -q "watchdog-run" webfrontend/htmlauth/api.cgi
          grep -q "save_groups" webfrontend/htmlauth/config.cgi
          python3 -m py_compile bin/*.py
          bash -n postinstall.sh postupgrade.sh preupgrade.sh cron/cron.01min daemon/daemon
          python3 - <<'PY'
          from pathlib import Path
          s=Path('webfrontend/htmlauth/index.cgi').read_text()
          start=s.find('print qq~<script>')
          end=s.find('</script>~;', start)
          assert start>=0 and end>start
          js=s[start+len('print qq~<script>'):end]
          js=js.replace('$csrf_js','"x"').replace('$public_api_js','"/x"').replace('$token_js','"x"').replace('$page_js','"overview"').replace('$groups_js','[]').replace('$aliases_js','{}')
          Path('/tmp/index.js').write_text(js)
          PY
          node --check /tmp/index.js
      - name: Package
        run: |
          zip -qr LoxBerry-UniFi-PoE-0.7.22.zip . -x '.git/*' '.github/*' 'tools/*' '*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: unifipoe-0.7.22-package
          path: LoxBerry-UniFi-PoE-0.7.22.zip

name: Signed Release v0.7.12

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger-0712'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY_B64: ${{ secrets.UNIFIPOE_ED25519_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require signing key
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY_B64:-}" || { echo 'Missing signing secret'; exit 1; }
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > /tmp/unifipoe-signing-key.pem
          chmod 600 /tmp/unifipoe-signing-key.pem
      - name: Apply security hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Version bumps
          p=Path('plugin.cfg'); s=p.read_text(); s=s.replace('VERSION=0.7.11','VERSION=0.7.12'); p.write_text(s)
          p=Path('bin/unifipoe.py'); s=p.read_text(); s=s.replace("VERSION='0.7.11'","VERSION='0.7.12'"); p.write_text(s)
          for fn in ('postinstall.sh','postupgrade.sh'):
              p=Path(fn); s=p.read_text().replace('0.7.11','0.7.12'); p.write_text(s)

          # index.cgi: stateless session-bound CSRF token + automatic header on POST.
          p=Path('webfrontend/htmlauth/index.cgi'); s=p.read_text()
          if 'use Digest::SHA qw(hmac_sha256_hex);' not in s:
              s=s.replace('use File::Basename qw(basename);','use File::Basename qw(basename);\nuse Digest::SHA qw(hmac_sha256_hex);')
          marker="my $public_api_js = encode_json('/plugins/'.$plugin_folder.'/poe.cgi');"
          if 'my $csrf_js' not in s:
              s=s.replace(marker, marker+"\nmy $csrf_seed = ($ENV{HTTP_COOKIE}//'').'|'.($ENV{HTTP_USER_AGENT}//'');\nmy $csrf_js = encode_json(hmac_sha256_hex($csrf_seed, ($c->{api_token}//'')));" )
          s=s.replace("const API='api.cgi';", "const API='api.cgi'; const CSRF=$csrf_js;")
          old="async function jsonFetch(url,opts={}){let r=await fetch(url,{cache:'no-store',...opts})"
          new="async function jsonFetch(url,opts={}){let hdr=new Headers(opts.headers||{});if((opts.method||'GET').toUpperCase()==='POST')hdr.set('X-UniFi-CSRF',CSRF);let r=await fetch(url,{cache:'no-store',...opts,headers:hdr})"
          if old not in s:
              raise SystemExit('index jsonFetch pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          csrf_helpers=r'''sub ct_eq {
  my ($a,$b)=@_; return 0 if !defined($a)||!defined($b)||length($a)!=length($b);
  my $v=0; for(my $i=0;$i<length($a);$i++){ $v |= ord(substr($a,$i,1)) ^ ord(substr($b,$i,1)); } return $v==0;
}
sub require_csrf {
  open my $cf,'<',$cfgfile or out({ok=>JSON::PP::false,error=>'CSRF-Konfiguration nicht lesbar.'});
  local $/; my $raw=<$cf>//''; close $cf; my $cc; eval{$cc=decode_json($raw);1} or out({ok=>JSON::PP::false,error=>'CSRF-Konfiguration ungültig.'});
  my $seed=($ENV{HTTP_COOKIE}//'').'|'.($ENV{HTTP_USER_AGENT}//'');
  my $expected=hmac_sha256_hex($seed,($cc->{api_token}//''));
  my $sent=$ENV{HTTP_X_UNIFI_CSRF}//'';
  out({ok=>JSON::PP::false,error=>'CSRF-Prüfung fehlgeschlagen.'}) unless ct_eq($sent,$expected);
}
'''

          # API: require CSRF for all state-changing commands; tighten switch/group/port validation.
          p=Path('webfrontend/htmlauth/api.cgi'); s=p.read_text()
          if 'use Digest::SHA qw(hmac_sha256_hex);' not in s:
              s=s.replace('use LoxBerry::System;','use LoxBerry::System;\nuse Digest::SHA qw(hmac_sha256_hex);')
          if 'sub require_csrf' not in s:
              s=s.replace('sub reject_cross_site {', csrf_helpers+'sub reject_cross_site {')
          s=s.replace("  reject_cross_site();\n  out({ok=>JSON::PP::false,error=>'Schaltbefehle sind nur per POST erlaubt.'})", "  reject_cross_site();\n  require_csrf();\n  out({ok=>JSON::PP::false,error=>'Schaltbefehle sind nur per POST erlaubt.'})")
          s=s.replace("if($cmd =~ /^group-/){ my $g=$q->param('group')//''; out({ok=>JSON::PP::false,error=>'Gruppe fehlt.'}) if $g eq '';", "if($cmd =~ /^group-/){ my $g=$q->param('group')//''; out({ok=>JSON::PP::false,error=>'Gruppe ungültig.'}) if $g eq '' || length($g)>80 || $g =~ /[\\r\\n\\0]/;")
          s=s.replace("out({ok=>JSON::PP::false,error=>'Switch/Port fehlt.'}) if $sw eq '' || $port !~ /^\\d+$/;", "out({ok=>JSON::PP::false,error=>'Switch/Port ungültig.'}) if $sw eq '' || length($sw)>128 || $sw =~ /[\\r\\n\\0]/ || $port !~ /^\\d+$/ || $port < 1 || $port > 512;")
          p.write_text(s)

          # Config: CSRF on save/test + stricter controller, user, site, token, MQTT topic and cycle bounds.
          p=Path('webfrontend/htmlauth/config.cgi'); s=p.read_text()
          if 'use Digest::SHA qw(hmac_sha256_hex);' not in s:
              s=s.replace('use File::Temp qw(tempfile);','use File::Temp qw(tempfile);\nuse Digest::SHA qw(hmac_sha256_hex);')
          if 'sub require_csrf' not in s:
              s=s.replace('sub reject_cross_site {', csrf_helpers+'sub reject_cross_site {')
          s=s.replace("    reject_cross_site();\n    out({ok=>JSON::PP::false,error=>'Speichern ist nur per POST erlaubt.'})", "    reject_cross_site();\n    require_csrf();\n    out({ok=>JSON::PP::false,error=>'Speichern ist nur per POST erlaubt.'})")
          s=s.replace("    reject_cross_site();\n    out({ok=>JSON::PP::false,error=>'Verbindungstest ist nur per POST erlaubt.'})", "    reject_cross_site();\n    require_csrf();\n    out({ok=>JSON::PP::false,error=>'Verbindungstest ist nur per POST erlaubt.'})")
          # Add validation after overlay for both save/test via helper.
          validate=r'''sub validate_cfg {
    my ($cfg)=@_;
    my $controller=$cfg->{controller}//'';
    out({ok=>JSON::PP::false,error=>'Controller-URL ungültig.'}) unless $controller =~ m{^https?://[^\\s/]+(?::\\d{1,5})?(?:/.*)?$}i && length($controller)<=512;
    out({ok=>JSON::PP::false,error=>'Benutzername ungültig.'}) if !defined($cfg->{username}) || $cfg->{username} eq '' || length($cfg->{username})>128 || $cfg->{username}=~/[\\r\\n\\0]/;
    my $site=$cfg->{site}//'default'; out({ok=>JSON::PP::false,error=>'Site ungültig.'}) if length($site)>80 || $site=~/[\\r\\n\\0]/;
    my $cy=int($cfg->{cycle_seconds}//5); out({ok=>JSON::PP::false,error=>'Cycle-Zeit muss zwischen 1 und 120 Sekunden liegen.'}) if $cy<1 || $cy>120;
    my $api=$cfg->{api_token}//''; out({ok=>JSON::PP::false,error=>'API-Token ungültig.'}) if length($api)<16 || length($api)>256 || $api=~/[\\r\\n\\0]/;
    my $topic=$cfg->{mqtt}{base_topic}//'unifipoe'; out({ok=>JSON::PP::false,error=>'MQTT Topic ungültig.'}) if length($topic)>128 || $topic=~/[+#\\s\\0]/;
}
'''
          if 'sub validate_cfg' not in s:
              s=s.replace('sub overlay_from_request {',validate+'sub overlay_from_request {')
          s=s.replace("    $cfg = overlay_from_request($cfg, 0);", "    $cfg = overlay_from_request($cfg, 0);\n    validate_cfg($cfg);")
          s=s.replace("    $cfg = overlay_from_request($cfg, 1);", "    $cfg = overlay_from_request($cfg, 1);\n    validate_cfg($cfg);")
          p.write_text(s)

          # Debug: CSRF for mutations and redact secrets before sending logs to browser.
          p=Path('webfrontend/htmlauth/debug.cgi'); s=p.read_text()
          if 'use Digest::SHA qw(hmac_sha256_hex);' not in s:
              s=s.replace('use LoxBerry::System;','use LoxBerry::System; use Digest::SHA qw(hmac_sha256_hex);')
          if 'sub require_csrf' not in s:
              s=s.replace('sub cross_site {', csrf_helpers.replace("out({ok=>JSON::PP::false,error=>'CSRF-Konfiguration nicht lesbar.'});","print encode_json({ok=>JSON::PP::false,error=>'CSRF-Konfiguration nicht lesbar.'}); exit;").replace("out({ok=>JSON::PP::false,error=>'CSRF-Konfiguration ungültig.'});","print encode_json({ok=>JSON::PP::false,error=>'CSRF-Konfiguration ungültig.'}); exit;").replace("out({ok=>JSON::PP::false,error=>'CSRF-Prüfung fehlgeschlagen.'}) unless ct_eq($sent,$expected);","if(!ct_eq($sent,$expected)){ print encode_json({ok=>JSON::PP::false,error=>'CSRF-Prüfung fehlgeschlagen.'}); exit; }")+'sub cross_site {')
          s=s.replace("if($action eq 'watchdog_run'){\n  if(cross_site())", "if($action eq 'watchdog_run'){\n  require_csrf();\n  if(cross_site())")
          s=s.replace("if($action eq 'clear'){\n  if(cross_site())", "if($action eq 'clear'){\n  require_csrf();\n  if(cross_site())")
          # Force POST for debug mutations.
          s=s.replace("if($action eq 'watchdog_run'){\n  require_csrf();", "if($action eq 'watchdog_run'){\n  if(uc($ENV{REQUEST_METHOD}//'GET') ne 'POST'){ print encode_json({ok=>JSON::PP::false,error=>'Nur POST erlaubt.'}); exit; }\n  require_csrf();")
          s=s.replace("if($action eq 'clear'){\n  require_csrf();", "if($action eq 'clear'){\n  if(uc($ENV{REQUEST_METHOD}//'GET') ne 'POST'){ print encode_json({ok=>JSON::PP::false,error=>'Nur POST erlaubt.'}); exit; }\n  require_csrf();")
          redact=r'''sub redact_line {
  my ($line,$cfg)=@_;
  my @secrets=grep { defined($_) && length($_)>=4 } ($cfg->{password},$cfg->{api_token},$cfg->{mqtt}{command_token});
  for my $secret (@secrets){ $line =~ s/\\Q$secret\\E/[REDACTED]/g; }
  $line =~ s{(Authorization\\s*:\\s*(?:Bearer|Basic)\\s+)[^\\s,;]+}{$1[REDACTED]}ig;
  $line =~ s{((?:password|passwd|token|api[_-]?token|secret)\\s*[=:]\\s*)[^\\s,;]+}{$1[REDACTED]}ig;
  $line =~ s{("(?:password|passwd|token|api_token|secret)"\\s*:\\s*")[^"]*(")}{$1[REDACTED]$2}ig;
  return $line;
}
'''
          if 'sub redact_line' not in s:
              s=s.replace('sub read_json_file {',redact+'sub read_json_file {')
          s=s.replace("chomp @all;\nprint encode_json({ok=>JSON::PP::true,lines=>\\@all,count=>scalar(@all)});", "chomp @all;\nmy $rcfg=read_json_file(\"$lbpconfigdir/config.json\"); @all=map { redact_line($_,$rcfg) } @all;\nprint encode_json({ok=>JSON::PP::true,lines=>\\@all,count=>scalar(@all)});")
          p.write_text(s)

          # Changelog
          p=Path('CHANGELOG.md'); s=p.read_text(); note='''## 0.7.12\n\n- Sitzungsgebundener HMAC-CSRF-Schutz für Admin-POSTs.\n- Zusätzliche Eingabevalidierung für Controller, MQTT, Ports, Gruppen und Tokens.\n- Secret-Redaction im Debug-Log für Passwörter, Tokens und Authorization-Header.\n- Debug-Mutationen nur noch per POST.\n\n'''
          if '## 0.7.12' not in s: s=s.replace('# Changelog\n\n','# Changelog\n\n'+note)
          p.write_text(s)
          PY
      - name: Validate hardening
        run: |
          set -euo pipefail
          python3 -m py_compile bin/unifipoe.py bin/watchdog.py bin/mqtt_listener.py bin/secure_update.py
          bash -n postinstall.sh preupgrade.sh postupgrade.sh cron/cron.01min daemon/daemon uninstall/uninstall.sh
          grep -q 'X-UniFi-CSRF' webfrontend/htmlauth/index.cgi
          grep -q 'require_csrf' webfrontend/htmlauth/api.cgi
          grep -q 'require_csrf' webfrontend/htmlauth/config.cgi
          grep -q 'redact_line' webfrontend/htmlauth/debug.cgi
          grep -q 'Nur POST erlaubt' webfrontend/htmlauth/debug.cgi
          grep -q 'VERSION=0.7.12' plugin.cfg
          perl -MDigest::SHA=hmac_sha256_hex -e 'print hmac_sha256_hex("x","y")' >/dev/null
      - name: Build, sign, verify and publish
        run: |
          set -euo pipefail
          rm -rf bin/__pycache__
          mkdir -p releases
          ZIP='releases/LoxBerry-UniFi-PoE-0.7.12.zip'; SHA="$ZIP.sha256"; SIG="$ZIP.sig"
          rm -f "$ZIP" "$SHA" "$SIG"
          zip -qr "$ZIP" README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend .gitattributes
          sha256sum "$ZIP" > "$SHA"
          openssl pkeyutl -sign -rawin -inkey /tmp/unifipoe-signing-key.pem -in "$ZIP" -out /tmp/unifipoe.sig
          base64 -w0 /tmp/unifipoe.sig > "$SIG"; printf '\n' >> "$SIG"
          python3 - <<'PY'
          import base64,importlib.util
          sp=importlib.util.spec_from_file_location('su','bin/secure_update.py'); m=importlib.util.module_from_spec(sp); sp.loader.exec_module(m)
          blob=open('releases/LoxBerry-UniFi-PoE-0.7.12.zip','rb').read(); sig=base64.b64decode(open('releases/LoxBerry-UniFi-PoE-0.7.12.zip.sig','rb').read()); pub=bytes.fromhex(m.TRUSTED_PUBLIC_KEY_HEX)
          assert m.verify_ed25519(sig,blob,pub)
          PY
          cat > release.cfg <<'EOF'
          [AUTOUPDATE]
          VERSION=0.7.12
          ARCHIVEURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.12/LoxBerry-UniFi-PoE-0.7.12.zip
          INFOURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/blob/main/CHANGELOG.md
          SHA256URL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.12/LoxBerry-UniFi-PoE-0.7.12.zip.sha256
          SIGURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.12/LoxBerry-UniFi-PoE-0.7.12.zip.sig
          EOF
          cp release.cfg prerelease.cfg
          rm -f .release-trigger-0712 .github/workflows/release-signed-0712.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'Release security hardening v0.7.12'; git push
          cat > /tmp/notes.md <<'EOF'
          ## UniFi PoE Control 0.7.12

          ### Security Hardening
          - Sitzungsgebundener HMAC-CSRF-Schutz für interne Admin-POSTs.
          - Strengere Eingabevalidierung.
          - Automatische Secret-Redaction im Debug-Log.
          - Debug-Schreibaktionen nur per POST.
          - SHA-256 + Ed25519 signierter Release.
          EOF
          gh release create v0.7.12 "$ZIP" "$SHA" "$SIG" --target main --title 'UniFi PoE Control v0.7.12' --notes-file /tmp/notes.md

name: Release v0.7.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.7.8.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden, test, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new))

          # Backend version.
          rep('bin/unifipoe.py', "VERSION='0.7.7'", "VERSION='0.7.8'")

          # Public Loxone API: token only via header or POST body, never query string.
          Path('webfrontend/html/poe.cgi').write_text(r'''#!/usr/bin/perl
use strict; use warnings; use CGI; use JSON::PP; use LoxBerry::System;
my $q=CGI->new; my $cfgfile="$lbpconfigdir/config.json";
open my $f,'<',$cfgfile or die "Content-Type: application/json\r\n\r\n{\"ok\":false,\"error\":\"config missing\"}";
local $/; my $c=decode_json(<$f>); close $f;
print "Content-Type: application/json\r\nCache-Control: no-store\r\nX-Content-Type-Options: nosniff\r\nReferrer-Policy: no-referrer\r\n\r\n";
sub eq_ct { my($a,$b)=@_; return 0 if !defined($a)||!defined($b)||length($a)!=length($b); my $d=0; for(my $i=0;$i<length($a);$i++){ $d |= ord(substr($a,$i,1)) ^ ord(substr($b,$i,1)); } return $d==0; }
my %body;
if(uc($ENV{REQUEST_METHOD}//'GET') eq 'POST'){
  my $raw=$q->param('POSTDATA');
  if(defined($raw) && $raw ne ''){ eval { my $x=decode_json($raw); %body=%$x if ref($x) eq 'HASH'; 1; }; }
  for my $k (qw(token cmd switch port group)){ my $v=$q->param($k); $body{$k}=$v if defined $v; }
}
my $token=$ENV{HTTP_X_API_TOKEN}//'';
if($token eq '' && ($ENV{HTTP_AUTHORIZATION}//'') =~ /^Bearer\s+(.+)$/i){ $token=$1; }
$token=$body{token}//'' if $token eq '';
if(!eq_ct($token,$c->{api_token}//'')){ print encode_json({ok=>JSON::PP::false,error=>'unauthorized'}); exit; }
my $cmd=$body{cmd}//$q->param('cmd')//'status';
my %allowed=map { $_=>1 } qw(devices selftest on off status cycle group-on group-off group-cycle);
if(!$allowed{$cmd}){ print encode_json({ok=>JSON::PP::false,error=>'invalid command'}); exit; }
my @args=("$lbpbindir/unifipoe.py",'--config',$cfgfile,$cmd);
if($cmd =~ /^group-/){ my $g=$body{group}//$q->param('group')//''; if($g eq ''){print encode_json({ok=>JSON::PP::false,error=>'group missing'});exit;} push @args,'--group',$g; }
elsif($cmd ne 'devices' && $cmd ne 'selftest'){ my $sw=$body{switch}//$q->param('switch')//''; my $port=$body{port}//$q->param('port')//''; if($sw eq ''||$port!~/^\d+$/){print encode_json({ok=>JSON::PP::false,error=>'switch/port missing'});exit;} push @args,'--switch',$sw,'--port',$port; }
open my $p,'-|',@args or do{print encode_json({ok=>JSON::PP::false,error=>'backend start failed'});exit;}; local $/; my $out=<$p>; close $p; print $out||encode_json({ok=>JSON::PP::false,error=>'empty backend response'});
''')

          # Config CGI: store MQTT command-token policy.
          p=Path('webfrontend/htmlauth/config.cgi'); s=p.read_text()
          s=s.replace("$cfg->{mqtt}{listen_enabled} = (($q->param('mqtt_listen_enabled')//'0') eq '1') ? JSON::PP::true : JSON::PP::false;", "$cfg->{mqtt}{listen_enabled} = (($q->param('mqtt_listen_enabled')//'0') eq '1') ? JSON::PP::true : JSON::PP::false;\n    my $mct = $q->param('mqtt_command_token');\n    $cfg->{mqtt}{command_token} = $mct if defined($mct) && $mct ne '';\n    $cfg->{mqtt}{command_token_required} = (($q->param('mqtt_command_token_required')//'0') eq '1') ? JSON::PP::true : JSON::PP::false;")
          s=s.replace('$cfg->{config_version} = 5;', '$cfg->{config_version} = 7;')
          p.write_text(s)

          # MQTT command token enforcement.
          p=Path('bin/mqtt_listener.py'); s=p.read_text()
          s=s.replace('import argparse, json, os, socket, struct, time, random, signal, sys, fcntl, importlib.util', 'import argparse, json, os, socket, struct, time, random, signal, sys, fcntl, importlib.util, hmac')
          old='''def payload_action(raw):\n    txt=raw.decode('utf-8','replace').strip()\n    try:\n        obj=json.loads(txt)\n        if isinstance(obj,dict): txt=str(obj.get('action',obj.get('cmd','')))\n    except Exception: pass\n    a=txt.strip().lower()\n    return {'1':'on','true':'on','ein':'on','on':'on','0':'off','false':'off','aus':'off','off':'off','restart':'cycle','reboot':'cycle','cycle':'cycle','status':'status','get':'status'}.get(a,a)\n'''
          new='''def payload_command(raw):\n    txt=raw.decode('utf-8','replace').strip(); token=''\n    try:\n        obj=json.loads(txt)\n        if isinstance(obj,dict):\n            token=str(obj.get('token','') or '')\n            txt=str(obj.get('action',obj.get('cmd','')))\n    except Exception:\n        if '|' in txt:\n            token,txt=txt.split('|',1)\n    a=txt.strip().lower()\n    action={'1':'on','true':'on','ein':'on','on':'on','0':'off','false':'off','aus':'off','off':'off','restart':'cycle','reboot':'cycle','cycle':'cycle','status':'status','get':'status'}.get(a,a)\n    return action,token.strip()\n'''
          if old not in s: raise SystemExit('mqtt payload parser pattern missing')
          s=s.replace(old,new)
          s=s.replace("rel=topic[len(prefix):].split('/'); action=payload_action(payload); api=core.UniFi(cfg)", "rel=topic[len(prefix):].split('/'); action,token=payload_command(payload); mc=cfg.get('mqtt',{}); expected=str(mc.get('command_token','') or '');\n    if mc.get('command_token_required',True) and (not expected or not hmac.compare_digest(token,expected)): raise PermissionError('MQTT Command-Token fehlt oder ist ungültig')\n    api=core.UniFi(cfg)")
          p.write_text(s)

          # Migration: create random MQTT command token and enforce it for upgraded installs.
          for fn in ('postinstall.sh','postupgrade.sh'):
              p=Path(fn); s=p.read_text()
              marker="if not c.get('api_token') or c.get('api_token')=='CHANGE_ME': c['api_token']=secrets.token_urlsafe(32)"
              extra=marker+"\nmc=c.setdefault('mqtt',{})\nif not mc.get('command_token') or mc.get('command_token')=='CHANGE_ME': mc['command_token']=secrets.token_urlsafe(32)\nmc['command_token_required']=True"
              if marker in s: s=s.replace(marker,extra,1)
              s=s.replace("mc=c.setdefault('mqtt',{})\nold_version", "old_version") if fn=='postupgrade.sh' else s
              s=s.replace("c['config_version']=6", "c['config_version']=7")
              s=s.replace("c['config_version']=5", "c['config_version']=7")
              s=s.replace('Plugin 0.7.5 installiert','Plugin 0.7.8 installiert').replace('Plugin auf 0.7.6 aktualisiert','Plugin auf 0.7.8 aktualisiert')
              p.write_text(s)

          # Secure updater: verified SHA-256 download, no automatic execution.
          Path('bin/secure_update.py').write_text(r'''#!/usr/bin/env python3
import argparse, hashlib, hmac, json, os, tempfile, urllib.parse, urllib.request
ALLOWED_HOSTS={'raw.githubusercontent.com','github.com','objects.githubusercontent.com'}
def fetch(url, limit=20*1024*1024):
    u=urllib.parse.urlparse(url)
    if u.scheme!='https' or u.hostname not in ALLOWED_HOSTS: raise RuntimeError('Unsichere oder nicht erlaubte Update-URL')
    req=urllib.request.Request(url,headers={'User-Agent':'LoxBerry-UniFi-PoE-secure-updater/0.7.8'})
    with urllib.request.urlopen(req,timeout=20) as r:
        data=r.read(limit+1)
    if len(data)>limit: raise RuntimeError('Update-Datei ist unerwartet groß')
    return data
def parse_cfg(data):
    out={}
    for line in data.decode('utf-8').splitlines():
        line=line.strip()
        if not line or line.startswith(('#','[')) or '=' not in line: continue
        k,v=line.split('=',1); out[k.strip().upper()]=v.strip()
    return out
def main():
    ap=argparse.ArgumentParser(); ap.add_argument('--manifest',default='https://raw.githubusercontent.com/DuettM/LoxBerry-UniFi-PoE/main/release.cfg'); ap.add_argument('--output-dir',default=''); a=ap.parse_args()
    meta=parse_cfg(fetch(a.manifest,256*1024)); url=meta.get('ARCHIVEURL',''); expected=meta.get('SHA256','').lower()
    if not url or len(expected)!=64 or any(c not in '0123456789abcdef' for c in expected): raise RuntimeError('Release-Manifest enthält keinen gültigen SHA256-Wert')
    blob=fetch(url); actual=hashlib.sha256(blob).hexdigest()
    if not hmac.compare_digest(actual,expected): raise RuntimeError('SHA256-Prüfung FEHLGESCHLAGEN – Update wird verworfen')
    outdir=a.output_dir or tempfile.gettempdir(); os.makedirs(outdir,exist_ok=True)
    name=os.path.basename(urllib.parse.urlparse(url).path) or 'unifipoe-update.zip'; path=os.path.join(outdir,name)
    fd,tmp=tempfile.mkstemp(prefix='.verified-',dir=outdir); os.write(fd,blob); os.close(fd); os.chmod(tmp,0o600); os.replace(tmp,path)
    print(json.dumps({'ok':True,'version':meta.get('VERSION',''),'sha256':actual,'path':path},ensure_ascii=False))
if __name__=='__main__': main()
''')

          # UI: MQTT token controls and POST-body HTTP generator.
          p=Path('webfrontend/htmlauth/index.cgi'); s=p.read_text()
          s=s.replace("print '<div class=\"field\"><label>Broker</label><input value=\"LoxBerry MQTT Gateway (automatisch)\" disabled><div class=\"hint\">Wird aus $LBHOME/config/system/general.json → Mqtt gelesen.</div></div></div><div class=\"checks\">';", "print '<div class=\"field\"><label>Broker</label><input value=\"LoxBerry MQTT Gateway (automatisch)\" disabled><div class=\"hint\">Wird aus $LBHOME/config/system/general.json → Mqtt gelesen.</div></div>';\nprint '<div class=\"field\"><label>MQTT Command-Token</label><div style=\"display:flex;gap:6px\"><input id=\"mqtt_command_token\" name=\"mqtt_command_token\" value=\"'.esc($c->{mqtt}{command_token}//'').'\"><button class=\"btn\" type=\"button\" onclick=\"newMqttToken()\">Neu</button><button class=\"btn\" type=\"button\" onclick=\"copyMqttToken()\">Kopieren</button></div><div class=\"hint\">Muss bei MQTT-Schaltbefehlen im Payload mitgesendet werden.</div></div></div><div class=\"checks\">';")
          s=s.replace("<label><input type=\"checkbox\" name=\"mqtt_retain\" value=\"1\"'.($c->{mqtt}{retain}?' checked':'').'> Status retained</label>", "<label><input type=\"checkbox\" name=\"mqtt_retain\" value=\"1\"'.($c->{mqtt}{retain}?' checked':'').'> Status retained</label><label><input type=\"checkbox\" name=\"mqtt_command_token_required\" value=\"1\"'.(($c->{mqtt}{command_token_required}//1)?' checked':'').'> MQTT Command-Token erforderlich</label>")
          s=s.replace("for(const n of ['verify_ssl','watchdog_enabled','mqtt_enabled','mqtt_listen_enabled','mqtt_retain'])", "for(const n of ['verify_ssl','watchdog_enabled','mqtt_enabled','mqtt_listen_enabled','mqtt_retain','mqtt_command_token_required'])")
          s=s.replace("async function copyToken(){let t=document.getElementById('api_token').value;if(await copyText(t)){let s=document.getElementById('settings-state');s.textContent='Token kopiert';setTimeout(()=>s.textContent='',1800)}}", "async function copyToken(){let t=document.getElementById('api_token').value;if(await copyText(t)){let s=document.getElementById('settings-state');s.textContent='Token kopiert';setTimeout(()=>s.textContent='',1800)}}\nfunction newMqttToken(){let a=new Uint8Array(32);crypto.getRandomValues(a);document.getElementById('mqtt_command_token').value=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');buildLoxoneUrl()}\nasync function copyMqttToken(){let t=document.getElementById('mqtt_command_token').value;if(await copyText(t)){let s=document.getElementById('settings-state');s.textContent='MQTT-Token kopiert';setTimeout(()=>s.textContent='',1800)}}")
          old="if(mode==='mqtt'){let map={on:'ON',off:'OFF',cycle:'CYCLE',status:'STATUS'};out.textContent=resolvedMqttBase()+'/set/port/'+d.id+'/'+p;pl.textContent=map[a]||a.toUpperCase();pw.style.display='block';lab.textContent='MQTT Topic'}else{out.textContent=location.origin+'/plugins/unifipoe/poe.cgi?token='+encodeURIComponent(t)+'&cmd='+encodeURIComponent(a)+'&switch='+encodeURIComponent(d.id)+'&port='+encodeURIComponent(p);pw.style.display='none';lab.textContent='Fertige URL'}"
          new="if(mode==='mqtt'){let mt=document.getElementById('mqtt_command_token')?.value||'';out.textContent=resolvedMqttBase()+'/set/port/'+d.id+'/'+p;pl.textContent=JSON.stringify({token:mt,action:a.toUpperCase()});pw.style.display='block';lab.textContent='MQTT Topic'}else{out.textContent=location.origin+'/plugins/unifipoe/poe.cgi';pl.textContent='token='+encodeURIComponent(t)+'&cmd='+encodeURIComponent(a)+'&switch='+encodeURIComponent(d.id)+'&port='+encodeURIComponent(p);pw.style.display='block';lab.textContent='HTTP POST URL'}"
          if old not in s: raise SystemExit('generator pattern missing')
          s=s.replace(old,new)
          s=s.replace("let mode=document.getElementById('gen-mode')?.value||'http',v=document.getElementById('gen-url').textContent+(mode==='mqtt'?'\\nPayload: '+document.getElementById('gen-payload').textContent:'')", "let mode=document.getElementById('gen-mode')?.value||'http',v=document.getElementById('gen-url').textContent+'\\nPayload: '+document.getElementById('gen-payload').textContent")
          s=s.replace("HTTP nutzt den API-Token. MQTT nutzt automatisch", "HTTP nutzt POST-Body oder Header statt Token in der URL. MQTT nutzt ein separates Command-Token und automatisch")
          p.write_text(s)

          # Changelog / README security notes.
          p=Path('CHANGELOG.md'); s=p.read_text(); note='''## 0.7.8\n\n- Loxone API-Token aus der URL entfernt; Authentifizierung über `X-API-Token`, `Authorization: Bearer` oder POST-Body.\n- MQTT-Command-Token eingeführt und bei Updates automatisch zufällig erzeugt.\n- Reine MQTT-ON/OFF/CYCLE-Payloads werden bei aktiviertem Token-Schutz abgewiesen.\n- Native ungeprüfte LoxBerry-Auto-Installation deaktiviert.\n- Neuer `secure_update.py` lädt Updates ausschließlich über HTTPS und akzeptiert sie nur bei passender SHA-256-Prüfsumme.\n- `release.cfg` veröffentlicht die SHA-256-Prüfsumme des Release-ZIPs.\n\n'''
          if '## 0.7.8' not in s: s=s.replace('# Changelog\n\n','# Changelog\n\n'+note)
          p.write_text(s)
          PY

          chmod 755 bin/secure_update.py webfrontend/html/poe.cgi
          python3 -m py_compile bin/unifipoe.py bin/watchdog.py bin/mqtt_listener.py bin/secure_update.py
          bash -n postinstall.sh preupgrade.sh postupgrade.sh cron/cron.01min daemon/daemon uninstall/uninstall.sh
          rm -rf bin/__pycache__

          # Build once, calculate digest, then write digest into release metadata and rebuild.
          mkdir -p releases
          rm -f releases/LoxBerry-UniFi-PoE-0.7.8.zip releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256
          zip -qr /tmp/unifipoe-078-pre.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          # release.cfg is part of the archive, so use a content manifest hash that excludes release metadata recursion.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files=[]
          for root in ['README.md','CHANGELOG.md','bin','config','cron','daemon','icons','plugin.cfg','postinstall.sh','postupgrade.sh','preupgrade.sh','uninstall','webfrontend']:
              p=Path(root)
              if p.is_file(): files.append(p)
              elif p.exists(): files.extend(x for x in p.rglob('*') if x.is_file() and '__pycache__' not in x.parts)
          h=hashlib.sha256()
          for p in sorted(files,key=lambda x:str(x)):
              h.update(str(p).encode()+b'\0'); h.update(hashlib.sha256(p.read_bytes()).digest())
          digest=h.hexdigest()
          text='[AUTOUPDATE]\nVERSION=0.7.8\nARCHIVEURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.8/LoxBerry-UniFi-PoE-0.7.8.zip\nINFOURL=https://github.com/DuettM/LoxBerry-UniFi-PoE/blob/main/CHANGELOG.md\nSHA256='+digest+'\nHASHMODE=content-manifest-v1\n'
          Path('release.cfg').write_text(text); Path('prerelease.cfg').write_text(text)
          Path('releases/LoxBerry-UniFi-PoE-0.7.8.content.sha256').write_text(digest+'  content-manifest-v1\n')
          PY
          zip -qr releases/LoxBerry-UniFi-PoE-0.7.8.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          sha256sum releases/LoxBerry-UniFi-PoE-0.7.8.zip > releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256

          # secure_update.py verifies normal ZIP SHA, so replace metadata SHA with final ZIP SHA after build.
          FINAL_SHA=$(sha256sum releases/LoxBerry-UniFi-PoE-0.7.8.zip | awk '{print $1}')
          sed -i "s/^SHA256=.*/SHA256=$FINAL_SHA/" release.cfg prerelease.cfg
          # Rebuild once more with final metadata. Publish the digest of this final artifact separately and use that exact digest in release cfg generated after build.
          zip -qr releases/LoxBerry-UniFi-PoE-0.7.8.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          FINAL_SHA=$(sha256sum releases/LoxBerry-UniFi-PoE-0.7.8.zip | awk '{print $1}')
          printf '%s  %s\n' "$FINAL_SHA" 'LoxBerry-UniFi-PoE-0.7.8.zip' > releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256
          # Store final artifact hash in a separate immutable-by-release checksum asset; secure updater may use SHA256URL fallback.
          sed -i '/^SHA256=/d' release.cfg prerelease.cfg
          printf 'SHA256URL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.8/LoxBerry-UniFi-PoE-0.7.8.zip.sha256\n' >> release.cfg
          printf 'SHA256URL=https://github.com/DuettM/LoxBerry-UniFi-PoE/releases/download/v0.7.8/LoxBerry-UniFi-PoE-0.7.8.zip.sha256\n' >> prerelease.cfg
          # Patch secure updater to accept SHA256URL to avoid self-referential archive hashing.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bin/secure_update.py'); s=p.read_text()
          s=s.replace("url=meta.get('ARCHIVEURL',''); expected=meta.get('SHA256','').lower()\n    if not url or len(expected)!=64 or any(c not in '0123456789abcdef' for c in expected): raise RuntimeError('Release-Manifest enthält keinen gültigen SHA256-Wert')", "url=meta.get('ARCHIVEURL',''); expected=meta.get('SHA256','').lower()\n    if not expected and meta.get('SHA256URL'):\n        expected=fetch(meta['SHA256URL'],4096).decode('utf-8').strip().split()[0].lower()\n    if not url or len(expected)!=64 or any(c not in '0123456789abcdef' for c in expected): raise RuntimeError('Release-Manifest enthält keinen gültigen SHA256-Wert')")
          p.write_text(s)
          PY
          python3 -m py_compile bin/secure_update.py
          rm -rf bin/__pycache__
          # Final package with updater pointing to external checksum. Checksum is computed after this package.
          zip -qr releases/LoxBerry-UniFi-PoE-0.7.8.zip README.md CHANGELOG.md bin config cron daemon icons plugin.cfg postinstall.sh postupgrade.sh preupgrade.sh prerelease.cfg release.cfg uninstall webfrontend
          FINAL_SHA=$(sha256sum releases/LoxBerry-UniFi-PoE-0.7.8.zip | awk '{print $1}')
          printf '%s  %s\n' "$FINAL_SHA" 'LoxBerry-UniFi-PoE-0.7.8.zip' > releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release security hardening v0.7.8"
          git push

          cat > /tmp/notes.md <<'EOF'
          ## UniFi PoE Control 0.7.8

          ### Security
          - API-Token nicht mehr in der URL: Header (`X-API-Token` / `Authorization: Bearer`) oder POST-Body.
          - Separates MQTT-Command-Token; standardmäßig erforderlich.
          - Native ungeprüfte LoxBerry-Auto-Installation deaktiviert.
          - Verifizierter Update-Downloader mit SHA-256-Prüfung.
          - Separate `.sha256`-Datei als Release-Asset.

          **Hinweis:** Die SHA-256-Prüfung schützt gegen beschädigte/manipulierte Downloads. Eine kryptografische Publisher-Signatur benötigt zusätzlich einen dauerhaft sicher verwahrten privaten Signierschlüssel; dieser wird bewusst nicht im Repository hinterlegt.
          EOF
          gh release create v0.7.8 releases/LoxBerry-UniFi-PoE-0.7.8.zip releases/LoxBerry-UniFi-PoE-0.7.8.zip.sha256 --target main --title "UniFi PoE Control v0.7.8" --notes-file /tmp/notes.md

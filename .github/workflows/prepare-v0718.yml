name: Prepare UniFi PoE v0.7.20
on:
  push:
    paths:
      - '.github/workflows/prepare-v0718.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken frontend JavaScript and bump version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('webfrontend/htmlauth/index.cgi')
          s=p.read_text()
          old="document.getElementById('api-example').textContent=location.origin+PUBLIC_API+'\nPOST: token='+TOKEN"
          new="document.getElementById('api-example').textContent=location.origin+PUBLIC_API+'\\\\nPOST: token='+TOKEN"
          if old not in s:
              raise SystemExit('broken updateApiExample string not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          for fn in ['plugin.cfg','release.cfg','prerelease.cfg']:
              q=Path(fn); t=q.read_text(); t=t.replace('0.7.19','0.7.20'); q.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webfrontend/htmlauth/index.cgi plugin.cfg release.cfg prerelease.cfg
          git commit -m 'Fix frontend JavaScript syntax in v0.7.20'
          git push
